<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat Layout Debug</title>
    <link rel="stylesheet" href="hole404.css">
    <style>
        /* Debug styles */
        .debug-border {
            border: 2px solid red !important;
        }
        .debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            z-index: 9999;
            font-size: 12px;
        }
        /* Force chat screen to be visible */
        .chat-screen {
            display: flex !important;
        }
    </style>
</head>
<body>
    <div class="debug-info">
        <div>Chat Screen Height: <span id="chatHeight">0</span>px</div>
        <div>Chat Messages Height: <span id="messagesHeight">0</span>px</div>
        <div>Chat Input Height: <span id="inputHeight">0</span>px</div>
        <div>Viewport Height: <span id="viewportHeight">0</span>px</div>
    </div>

    <!-- Chat screen -->
    <div class="chat-screen active debug-border" id="chatScreen">
        <div class="chat-header debug-border">
            <div class="room-info">
                <h2>Debug Room</h2>
                <p>Testing chat layout</p>
            </div>
            <div class="chat-actions">
                <button class="action-btn">Test Button</button>
            </div>
        </div>
        
        <div class="chat-messages debug-border" id="chatMessages">
            <div class="message">
                <div class="message-header">
                    <div class="message-avatar">🎭</div>
                    <span class="message-author">Test User</span>
                    <span class="message-time">12:34</span>
                </div>
                <div class="message-content">This is a test message to check the layout.</div>
            </div>
            <div class="message">
                <div class="message-header">
                    <div class="message-avatar">👤</div>
                    <span class="message-author">Another User</span>
                    <span class="message-time">12:35</span>
                </div>
                <div class="message-content">Another test message.</div>
            </div>
        </div>
        
        <div class="chat-input debug-border" id="chatInput">
            <textarea 
                id="messageInput" 
                class="message-input" 
                placeholder="Testing input visibility..."
                rows="1"></textarea>
            <button class="send-btn" id="sendBtn">
                ➤
            </button>
        </div>
    </div>

    <script>
        // Debug script
        function updateDebugInfo() {
            const chatScreen = document.getElementById('chatScreen');
            const chatMessages = document.getElementById('chatMessages');
            const chatInput = document.getElementById('chatInput');
            
            document.getElementById('chatHeight').textContent = chatScreen.offsetHeight;
            document.getElementById('messagesHeight').textContent = chatMessages.offsetHeight;
            document.getElementById('inputHeight').textContent = chatInput.offsetHeight;
            document.getElementById('viewportHeight').textContent = window.innerHeight;
            
            // Check computed styles
            console.log('Chat Screen computed style:', window.getComputedStyle(chatScreen));
            console.log('Chat Input computed style:', window.getComputedStyle(chatInput));
        }
        
        // Update on load and resize
        window.addEventListener('load', updateDebugInfo);
        window.addEventListener('resize', updateDebugInfo);
        
        // Initial update
        updateDebugInfo();
    </script>
</body>
</html>
